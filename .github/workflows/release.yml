name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # Windows only, deliberately: `app/src/paths.rs` resolves config, log and
    # recovery files from %APPDATA%/%LOCALAPPDATA%, which don't exist
    # elsewhere. A mac/linux job would compile and then produce a binary that
    # can't load or save anything.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Create the release only if this tag doesn't already have one - a
          # release published by hand keeps its notes and stays published.
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --draft --title "RustyNesting $tag" --generate-notes
          # Copy rather than pass `path#label`: gh's `#` syntax sets the
          # asset's *label*, and the file still downloads under its own name.
          asset="RustyNesting_${tag#v}_x64.exe"
          cp target/release/rustynesting.exe "$asset"
          gh release upload "$tag" "$asset" --clobber
