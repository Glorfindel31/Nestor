name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bin: rustynesting.exe
            suffix: x64.exe
          - platform: macos-latest
            bin: rustynesting
            suffix: macos_arm64
          - platform: ubuntu-latest
            bin: rustynesting
            suffix: linux_x64

    runs-on: ${{ matrix.platform }}
    # Windows is the only platform this app has ever shipped a working build
    # for - mac and linux were silently broken from v2.0.0 until `paths.rs`
    # stopped reading %APPDATA% directly, and have never been compiled here.
    # They are best-effort until they have proved themselves on a few tags;
    # neither may hold up a Windows release.
    continue-on-error: ${{ matrix.platform != 'windows-latest' }}

    steps:
      - uses: actions/checkout@v5

      # eframe's glow backend needs the X11/Wayland headers and rfd needs GTK
      # for its native dialogs. Both come preinstalled on the other two.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Create the release only if this tag doesn't already have one - a
          # release published by hand keeps its notes and stays published.
          # Three jobs race here, so the losers must not treat "it already
          # exists" as failure; they just go on and upload their own asset.
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --draft --title "Nestor $tag" --generate-notes ||
            true
          # Copy rather than pass `path#label`: gh's `#` syntax sets the
          # asset's *label*, and the file still downloads under its own name.
          # Deliberately NOT versioned. Defender and SmartScreen build reputation
          # against the hash *and* the filename; a new name every tag resets that
          # to zero prevalence forever, which is one of the inputs behind the
          # Wacatac.B!ml false positives. The tag already names the version.
          asset="Nestor_${{ matrix.suffix }}"
          cp "target/release/${{ matrix.bin }}" "$asset"
          gh release upload "$tag" "$asset" --clobber
