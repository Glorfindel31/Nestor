[package]
name = "rustynesting"
# Two binaries live here, so a bare `cargo run -p rustynesting` is ambiguous
# without this - and the window is what you almost always mean.
default-run = "rustynesting"
version.workspace = true
edition.workspace = true

[lib]
# The engine entry points (`commands`, `dto`) are plain UI-free functions, and
# two binaries need them: the window and the headless `nest` CLI. Cargo will
# only share code between binaries through a library.
name = "rustynesting"
path = "src/lib.rs"

[[bin]]
name = "rustynesting"
path = "src/main.rs"

[[bin]]
# Headless: import, nest, report, optionally export. Its own binary rather
# than a flag on the GUI one, because that one is built for the `windows`
# subsystem and has no stdout when run from a terminal.
name = "nest"
path = "src/bin/nest.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
# `x11`/`wayland` are Linux's winit backends, and `default-features = false`
# drops them: eframe/x11 -> egui-winit/x11 -> winit/x11. Without them winit
# hits its own `compile_error!("The platform you're compiling for is not
# supported")` on Linux. Inert on Windows and macOS, which need no backend
# feature, so they stay unconditional rather than in a target table.
eframe = { version = "0.32", default-features = false, features = ["glow", "persistence", "default_fonts", "x11", "wayland"] }
egui = "0.32"
rfd = "0.17"
# Resolves the per-OS config/data directories. See `paths.rs` for why this
# earns its place over two env vars.
dirs = "6"
geometry = { path = "../crates/geometry" }
nesting = { path = "../crates/nesting" }
dxf = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# Local wall-clock time, for the timestamped export filenames and the report's
# "generated" line. Already in the tree via `dxf`, so this adds no new crates.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
