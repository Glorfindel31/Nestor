[package]
name = "rustynesting"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustynesting"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
# `x11`/`wayland` are Linux's winit backends, and `default-features = false`
# drops them: eframe/x11 -> egui-winit/x11 -> winit/x11. Without them winit
# hits its own `compile_error!("The platform you're compiling for is not
# supported")` on Linux. Inert on Windows and macOS, which need no backend
# feature, so they stay unconditional rather than in a target table.
eframe = { version = "0.32", default-features = false, features = ["glow", "persistence", "default_fonts", "x11", "wayland"] }
egui = "0.32"
rfd = "0.17"
# Resolves the per-OS config/data directories. See `paths.rs` for why this
# earns its place over two env vars.
dirs = "6"
geometry = { path = "../crates/geometry" }
nesting = { path = "../crates/nesting" }
dxf = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# Local wall-clock time, for the timestamped export filenames and the report's
# "generated" line. Already in the tree via `dxf`, so this adds no new crates.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
